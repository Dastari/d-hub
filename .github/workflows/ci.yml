name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust with formatting and Clippy
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: python3 tests/terminal_smoke.py
      - run: cargo +stable run --locked -- demo --snapshot
