[package]
name = "d-hub"
version = "0.4.8"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first communications drawer for Omarchy and Ghostty"
repository = "https://github.com/dastari/d-hub"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
tempfile = "3"
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
sha2 = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "form", "rustls"] }
rpassword = "7.5.4"
zeroize = "1"
zbus = "5.19"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
nix = { version = "0.31.2", features = ["socket", "user"] }

imap = "2.4.1"
native-tls = "0.2"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mailparse = "0.18.0"
html2text = "0.17.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

tungstenite = { version = "0.30.0", features = ["native-tls"] }
openssl = "0.10.81"
qrcode = { version = "0.14.1", default-features = false }
base64 = "0.22"

[dev-dependencies]
quircs = "0.10.3"

[profile.release]
lto = "thin"
strip = true
